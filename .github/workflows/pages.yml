name: Publish simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "china-simulator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload simulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./china-simulator
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
